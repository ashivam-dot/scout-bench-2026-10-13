name: extract
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q trafilatura crawl4ai && crawl4ai-setup
      - run: python extract_bench.py extract.json
      - uses: actions/upload-artifact@v4
        with:
          name: extract
          path: extract.json
