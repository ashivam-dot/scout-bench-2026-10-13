name: outlets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q trafilatura
      - run: python outlet_probe.py outlets.json
      - uses: actions/upload-artifact@v5
        with:
          name: outlets
          path: outlets.json
